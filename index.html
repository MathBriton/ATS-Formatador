<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS Formatador</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <svg class="logo" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
          <rect width="28" height="28" rx="7" fill="currentColor" />
          <path d="M9 8h10M9 12h10M9 16h6" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" />
          <path d="m15.5 20 2 2 4-4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
        <div class="doc-info">
          <label class="sr-only" for="resume-title">Nome do currículo</label>
          <input id="resume-title" class="title-input" maxlength="80" spellcheck="false" autocomplete="off" />
          <div class="doc-sub"><span class="brand">ATS Formatador</span><span id="save-status" role="status"></span></div>
        </div>
      </div>

      <div class="topbar-right">
        <div class="menu-wrap">
          <button type="button" id="file-menu-btn" class="btn" aria-haspopup="menu" aria-expanded="false" aria-controls="file-menu">
            Arquivo <span aria-hidden="true">▾</span>
          </button>
          <div id="file-menu" class="menu" role="menu" aria-label="Arquivo" hidden></div>
        </div>
        <button type="button" id="export-pdf" class="btn btn-primary" aria-label="Exportar PDF"><span class="hide-sm">Exportar </span>PDF</button>
      </div>

      <input type="file" id="import-file" accept="application/json,.json" hidden />
    </header>

    <main class="layout">
      <div class="main-col">
        <nav class="tabs" aria-label="Modo">
          <button type="button" class="tab active" data-tab="edit">Editar</button>
          <button type="button" class="tab" data-tab="preview">Pré-visualizar</button>
        </nav>

        <div id="form"></div>
        <article id="print-area" aria-label="Currículo"></article>
      </div>

      <aside class="side card">
        <h2>Compatibilidade ATS</h2>
        <div class="score">
          <span id="score-value" class="score-value">0</span>
          <span class="muted">/ 100</span>
        </div>
        <div id="score-bar" class="score-bar"><div></div></div>
        <p id="score-summary" class="muted small"></p>

        <p class="muted small">
          Use <strong>Exportar PDF</strong> no topo: abre o diálogo de impressão, onde você escolhe
          <strong>Salvar como PDF</strong>. Se aparecerem cabeçalhos e rodapés (URL, data), desmarque essa opção.
          Erros bloqueiam a exportação; avisos são recomendações.
        </p>

        <ul id="check-list" class="check-list"></ul>
      </aside>
    </main>

    <script src="validator.js"></script>
    <script src="app.js"></script>
  </body>
</html>
